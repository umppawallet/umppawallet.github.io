<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>엄빠지갑 오늘의 최저가</title><style>
:root{--bg:#f6f4ef;--ink:#1d1d1f;--sub:#6b6b70;--line:#e7e3da;--accent:#e8503a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{padding:22px 2px 10px}
.brand{font-size:13px;color:var(--sub);letter-spacing:.02em}
h1{font-size:24px;font-weight:800;margin-top:2px}
.date{display:flex;gap:6px;margin:14px 0 8px;overflow-x:auto}
.date span{flex:none;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.date span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.notice{font-size:11.5px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:block;background:#fff;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid var(--line)}
.ph{position:relative;aspect-ratio:1/1;background:#fff}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.shop{position:absolute;left:8px;top:8px;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.info{padding:10px 11px 12px;border-top:1px solid #f1eee8}
.nm{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qty{font-size:12px;color:var(--sub);margin-top:3px}
.pr{font-size:21px;font-weight:800;margin-top:7px;letter-spacing:-.01em}
.pr small{font-size:14px;font-weight:700;margin-left:1px}
.ship{display:inline-block;margin-top:5px;font-size:11px;color:#2f7d4f;background:#eaf6ee;padding:2px 7px;border-radius:5px}
.ship.warn{color:#8a6100;background:#fff3c4}
footer{margin-top:22px;font-size:12px;color:var(--sub);text-align:center;line-height:1.6}

.grid{grid-template-columns:repeat(3,1fr)!important;gap:7px!important}
.card{border-radius:10px!important}
.shop{left:5px!important;top:5px!important;font-size:9.5px!important;padding:2px 5px!important;border-radius:5px!important}
.info{padding:6px 7px 8px!important}
.nm{font-size:12px!important;line-height:1.3!important}
.qty{font-size:10.5px!important;margin-top:2px!important}
.pr{font-size:15px!important;margin-top:4px!important;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pr small{font-size:11px!important}
.ship{margin-top:0!important;font-size:9.5px!important;padding:1px 5px!important;font-weight:600}

.grid{grid-template-columns:repeat(3,1fr)!important;gap:6px!important}
.card{border-radius:8px!important}
.info{padding:5px 6px 7px!important;border-top:none!important}
.t{font-size:11.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#333}
.t b{font-weight:800;color:#111;margin-right:3px}
.t .s{display:inline-block;font-size:9.5px;font-weight:700;color:#2f7d4f;background:#eaf6ee;border-radius:4px;padding:0 4px;margin-right:3px;vertical-align:1px}
.t .s.warn{color:#8a6100;background:#fff3c4}
.shop{font-size:9px!important;padding:1px 4px!important;left:4px!important;top:4px!important;opacity:.92}
header{padding:14px 2px 6px!important} h1{font-size:20px!important}
.date{margin:10px 0 6px!important} .date span{padding:5px 10px!important;font-size:12px!important}
.notice{font-size:11px!important;padding:7px 9px!important;margin-bottom:10px!important}
.ad{font-size:13px;font-weight:700;color:#3a2a00;background:#ffe9a8;border:1px solid #f0c64a;border-radius:10px;padding:9px 11px;margin:2px 0 8px;line-height:1.45}.notice:empty{display:none}</style></head><body><div class="wrap"><header><div class="brand">엄빠지갑</div><h1>오늘의 최저가</h1></header><div class="ad">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div><div class="notice"></div><div class="grid"><p>지금은 올라온 특가가 없어요</p></div><footer>엄마아빠들 지갑에 도움 되는 이벤트와 할인 행사,<br>앞으로도 계속 알려드릴게요</footer></div></body></html>
